[package]
name = "t3-maeve-tts"
version = "0.1.0"
edition = "2024"
publish = false
description = "Streams Phonon speech for T3 Code's voice replies over stdin/stdout"
license = "MIT"

[[bin]]
name = "t3-maeve-tts"
path = "src/main.rs"

[dependencies]
ptts = { version = "=0.6.0", features = ["hf"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
